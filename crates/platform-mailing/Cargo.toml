[package]
name = "platform-mailing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Provider-neutral mail send contract with an opt-in lettre SMTP adapter and a deterministic in-crate mock."

[lints]
workspace = true

[features]
default = []
mock = []
smtp-lettre = ["dep:lettre", "dep:tokio"]

[dependencies]
platform-core = { path = "../platform-core" }
async-trait = { workspace = true }
time = { workspace = true }
lettre = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
toml = { workspace = true }

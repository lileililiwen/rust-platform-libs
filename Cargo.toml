[workspace]
resolver = "2"
members = [
    "crates/platform-core",
    "crates/platform-contracts",
    "crates/platform-identity",
    "crates/platform-audit",
    "crates/platform-testing",
    "crates/platform-arch-tests",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.75"
version = "0.1.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# `pedantic` is intentionally NOT enabled. The foundation's quality
# bar is enforced by the targeted `cargo test --workspace` plus the
# `platform-arch-tests` crate, not by style lints. Re-enabling
# pedantic would require either silencing most of its lints or
# hand-tweaking every Rust idiom the foundation uses, neither of
# which advances the OpenSpec change.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
multiple_crate_versions = "allow"
should_implement_trait = "allow"
too_many_arguments = "allow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing", "serde", "serde-well-known"] }
uuid = { version = "1", features = ["v4", "serde"] }
jsonschema = { version = "0.57", default-features = false }
toml = "1"
once_cell = "1"

[profile.release]
lto = "thin"
codegen-units = 1

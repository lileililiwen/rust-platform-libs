[workspace]
resolver = "2"
members = [
    "crates/platform-core",
    "crates/platform-contracts",
    "crates/platform-identity",
    "crates/platform-audit",
    "crates/platform-testing",
    "crates/platform-arch-tests",
    "crates/platform-mailing",
    "crates/platform-ai",
    "tests/consumer-fixture",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.75"
version = "0.1.0"
publish = true
# Repository URL is a tracked precondition. The workspace has no git
# remote today (verified 2026-09-30, again at implementation on
# 2026-10-01) and the workspace-governance GitHub-publication flow
# (`scripts/github_metadata.py` in workspace-governance) is the
# replacement path. Until the owner publishes the repository, this
# value is a placeholder; `PUBLICATION-APPROVED` + the tag-version
# precheck + the `CARGO_REGISTRY_TOKEN` secret in `.github/workflows/
# publish.yml` keep any real release gated on that decision.
repository = "https://github.com/rust-platform-libs/rust-platform-libs"
homepage = "https://github.com/rust-platform-libs/rust-platform-libs"
# The `documentation` field is per-crate (each crate's docs.rs URL),
# not a workspace-inheritable default; per-crate `documentation`
# entries below point at https://docs.rs/<name> as crates.io
# conventionally does.
readme = "README.md"
keywords = ["platform", "rust", "contracts", "cross-cutting", "framework-neutral"]
categories = ["development-tools"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# `pedantic` is intentionally NOT enabled. The foundation's quality
# bar is enforced by the targeted `cargo test --workspace` plus the
# `platform-arch-tests` crate, not by style lints. Re-enabling
# pedantic would require either silencing most of its lints or
# hand-tweaking every Rust idiom the foundation uses, neither of
# which advances the OpenSpec change.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
multiple_crate_versions = "allow"
should_implement_trait = "allow"
too_many_arguments = "allow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["net", "time", "rt", "macros"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-tls"] }
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing", "serde", "serde-well-known"] }
uuid = { version = "1", features = ["v4", "serde"] }
jsonschema = { version = "0.57", default-features = false }
toml = "1"
once_cell = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
futures = "0.3"
async-stream = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
